<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE</title>
    
</head>
<body>
       <label for="father_name">father_name: </label>
        <input type="text" id="father_name" required>
        <label for="mother_name">mother_name: </label>
        <input type="text" id="mother_name" required> <br>

       <label for="marital_status">marital_status: </label>
<select id="marital_status" onchange="toggleSpouseField()">
    <option value="Single">Single</option>
    <option value="Married">Married</option>
</select><br>

<div id="spouse_container" style="display: none;">
    <label for="spouse_name">spouse_name: </label>
    <input type="text" id="spouse_name"><br>
</div>

<script>
function toggleSpouseField() {
    const status = document.getElementById("marital_status").value;
    const spouseContainer = document.getElementById("spouse_container");
    spouseContainer.style.display = status === "Married" ? "block" : "none";
}
</script>


<!-- Category -->
<label for="category">Category: </label>
<select id="category" name="category" required>
    <option value="" disabled selected>Select Category</option>
    <option value="General Category">General Category</option>
    <option value="Persons with Disability(PwD)">Persons with Disability(PwD)</option>
    <option value="Schedule Caste">Schedule Caste</option>
    <option value="Schedule Tribe">Schedule Tribe</option>
    <option value="Ex-servicemen">Ex-servicemen</option>
    <option value="War Widow/Next of Kin">War Widow/Next of Kin</option>
</select><br>

<!-- Physical Disability -->
<label for="physically_disabled">Physically Disabled: </label>
<select id="physically_disabled" name="physically_disabled" onchange="toggleDisabilityField()" required>
    <option value="No">No</option>
    <option value="Yes">Yes</option>
</select><br>

<div id="disability_percentage_container" style="display: none;">
    <label for="disability_percentage">Disability Percentage: </label>
    <select id="disability_percentage" name="disability_percentage">
        <option value="" disabled selected>Select Percentage</option>
        <option value="Above 40%">Above 40%</option>
        <option value="Below 40%">Below 40%</option>
    </select><br>
</div>

<!-- Landline / Alternate Phone -->
<label for="std_code">STD Code: </label>
<input type="text" id="std_code" name="std_code" pattern="[0-9]{2,5}" placeholder="e.g. 011">
<label for="phone">Phone: </label>
<input type="tel" id="phone" name="phone" pattern="[0-9]{6,8}"><br>

<!-- Aadhaar -->
<label for="aadhaar">Aadhaar: </label>
<input type="text" id="aadhaar" name="aadhaar" pattern="[0-9]{12}" maxlength="12" placeholder="12-digit Aadhaar"><br>

<!-- Bank Details -->
<label for="bank_name">Bank Name: </label>
<input type="text" id="bank_name" name="bank_name" placeholder="e.g. State Bank of India"><br>

<label for="branch">Branch: </label>
<input type="text" id="branch" name="branch"><br>

<label for="ifsc_code">IFSC Code: </label>
<input type="text" id="ifsc_code" name="ifsc_code" pattern="^[A-Z]{4}0[A-Z0-9]{6}$" placeholder="ABCD0123456" style="text-transform:uppercase"><br>

<label for="bank_account_number">Bank Account Number: </label>
<input type="text" id="bank_account_number" name="bank_account_number"><br>

<!-- Address Details -->
<label for="house_no">House No: </label>
<input type="text" id="house_no" name="house_no"><br>

<label for="street">Street: </label>
<input type="text" id="street" name="street"><br>

<label for="area">Area: </label>
<input type="text" id="area" name="area"><br>

<label for="town">Town: </label>
<input type="text" id="town" name="town"><br>

<label for="state">State: </label>
<input type="text" id="state" name="state"><br>

<label for="district">District: </label>
<input type="text" id="district" name="district"><br>

<label for="pincode">Pincode: </label>
<input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6"><br>

<!-- Joint Applicant Toggle -->
<label for="has_joint">Has Joint Applicant? </label>
<select id="has_joint" onchange="toggleJointSection()">
    <option value="No">No</option>
    <option value="Yes">Yes</option>
</select><br>

<!-- Joint Applicant Fields -->
<div id="joint_container" style="display: none; border-left: 2px solid #ccc; padding-left: 10px; margin-top: 10px;">
    <h4>Joint Applicant Details</h4>

    <label for="joint_first_name">First Name: </label>
    <input type="text" id="joint_first_name" name="joint_first_name"><br>

    <label for="joint_middle_name">Middle Name: </label>
    <input type="text" id="joint_middle_name" name="joint_middle_name"><br>

    <label for="joint_last_name">Last Name: </label>
    <input type="text" id="joint_last_name" name="joint_last_name"><br>

    <label for="joint_relation">Relation: </label>
    <input type="text" id="joint_relation" name="joint_relation"><br>

    <label for="joint_gender">Gender: </label>
    <select id="joint_gender" name="joint_gender">
        <option value="" disabled selected>Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select><br>

    <label for="joint_father_name">Father's Name: </label>
    <input type="text" id="joint_father_name" name="joint_father_name"><br>

    <label for="joint_mother_name">Mother's Name: </label>
    <input type="text" id="joint_mother_name" name="joint_mother_name"><br>

    <label for="joint_marital_status">Marital Status: </label>
    <select id="joint_marital_status" name="joint_marital_status" onchange="toggleJointSpouseField()">
        <option value="Single">Single</option>
        <option value="Married">Married</option>
    </select><br>

    <div id="joint_spouse_container" style="display: none;">
        <label for="joint_spouse_name">Spouse Name: </label>
        <input type="text" id="joint_spouse_name" name="joint_spouse_name"><br>
    </div>

    <label for="joint_dob">Date of Birth: </label>
    <input type="text" id="joint_dob" name="joint_dob" placeholder="DD/MM/YYYY"><br>

    <label for="joint_pan">PAN: </label>
    <input type="text" id="joint_pan" name="joint_pan" maxlength="10" placeholder="ABCDE1234F" style="text-transform:uppercase"><br>

    <label for="joint_aadhaar">Aadhaar: </label>
    <input type="text" id="joint_aadhaar" name="joint_aadhaar" pattern="[0-9]{12}" maxlength="12" placeholder="12-digit Aadhaar"><br>

    <label for="joint_category">Category: </label>
    <select id="joint_category" name="joint_category">
        <option value="" disabled selected>Select Category</option>
        <option value="General Category">General Category</option>
        <option value="Persons with Disability(PwD)">Persons with Disability(PwD)</option>
        <option value="Schedule Caste">Schedule Caste</option>
        <option value="Schedule Tribe">Schedule Tribe</option>
        <option value="Ex-servicemen">Ex-servicemen</option>
        <option value="War Widow/Next of Kin">War Widow/Next of Kin</option>
    </select><br>

    <label for="joint_email">Email: </label>
    <input type="email" id="joint_email" name="joint_email"><br>

    <label for="joint_mobile">Mobile: </label>
    <input type="tel" id="joint_mobile" name="joint_mobile" pattern="[0-9]{10}" maxlength="10"><br>

    <label for="joint_std_code">STD Code: </label>
    <input type="text" id="joint_std_code" name="joint_std_code" pattern="[0-9]{2,5}">
    <label for="joint_phone">Phone: </label>
    <input type="tel" id="joint_phone" name="joint_phone" pattern="[0-9]{6,8}"><br>
</div>

<script>
function toggleSpouseField() {
    const status = document.getElementById("marital_status").value;
    const spouseContainer = document.getElementById("spouse_container");
    spouseContainer.style.display = status === "Married" ? "block" : "none";
}

function toggleDisabilityField() {
    const status = document.getElementById("physically_disabled").value;
    const container = document.getElementById("disability_percentage_container");
    container.style.display = status === "Yes" ? "block" : "none";
}

function toggleJointSection() {
    const hasJoint = document.getElementById("has_joint").value;
    const container = document.getElementById("joint_container");
    container.style.display = hasJoint === "Yes" ? "block" : "none";
}

function toggleJointSpouseField() {
    const status = document.getElementById("joint_marital_status").value;
    const container = document.getElementById("joint_spouse_container");
    container.style.display = status === "Married" ? "block" : "none";
}
</script>








</body>
</html>
