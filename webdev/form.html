<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
       <form action="index.php" method="POST" enctype="multipart/form-data">
        <!--POST IS CONFIDENTIAL DATA like USERNAME PASSWORD-->
        <!--GET IS FOR INSENSITIVE DATA-->

       <label for="Username">Username: </label>
        <input type="text" id="Username" placeholder="name.dob" minlength="7" maxlength="11 " required> <br>

         <label for="Password">Password: </label>
         <input type="Password" id ="Password" minlength="6" maxlength="12"  required> <br>

           <label for="Email">Email: </label>
           <input type="email" id="email" placeholder="name11@gmail.com"> <br>

           <label for="Phone">Phone: </label>
           <input type ="tele" id ="Phone" placeholder="987-654-0124" pattern ="[0-9]{3}-[0-9]{3}-[0-9]{4}" required> <br>

           <label for="DOB">DOB: </label>
           <input type ="DOB" id="DOB" placeholder="DD-MM-YYYY"> <br>

           <label for="Quantity">Quantity: </label>
           <input type="number" id="Quantity" min="0" max="99"><br>

           <label for="Title">Title: </label>

           <label for="Mr.">Mr.: </label>
            <input type="radio" id="Mr." value="Mr." name="Title" >

           <label for="Mrs.">Mrs.: </label>
           <input type="radio" id="Mrs." value="Mrs." name="Title" >

           <label for="Dr.">Dr.: </label>
           <input type="radio" id="Dr." value="Dr." name="Title" >

           <label for="Er.">Er.: </label>
           <input type="radio" id="Er." value="Er." name="Title" > <br>


            <label for="Payment">Payment: </label>
            <select id="payment">
                <option value="Visa">Visa</option>
                <option value ="MasterCard">MasterCard</option>
                <option value ="Giftcard">Giftcard</option>
 <br>
            </select>
<br>

             <label for="FOLLOW">FOLLOW: </label>
             <input type="checkbox" id="FOLLOW"><br>

             <label for="comment">Comment: </label>
             <textarea id ="comment" rows="3" cols="20"></textarea>

             <label for ="file">file:</label>
             <input type="file" id="file" accept="image/png, image/jpeg"> <br>


               <input type="reset"> <br>
        <input type="submit">
       </form>
</body>
</html>
